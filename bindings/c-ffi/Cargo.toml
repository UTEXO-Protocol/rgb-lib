[package]
name = "rgb-lib-c-ffi"
version = "0.1.0"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.88.0"
build = "build.rs"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "rgblibcffi"

[dependencies]
rgb-lib = { version = "0.3.0-beta.6", path = "../../", features = [
    "electrum",
    "esplora",
] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
] }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[build-dependencies]
cbindgen = "0.29.0"

[workspace]

[patch.crates-io]
rgb-aluvm = { git = "https://github.com/rgb-protocol/rgb-aluvm", rev = "536fb55" }
rgb-consensus = { git = "https://github.com/rgb-protocol/rgb-consensus", rev = "768249aa" }
rgb-invoicing = { git = "https://github.com/Jainakin/rgb-ops", rev = "80a2608f95fd8784441efa38cf8085d607480057" }
rgb-ops = { git = "https://github.com/Jainakin/rgb-ops", rev = "80a2608f95fd8784441efa38cf8085d607480057" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "7feb0f2" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8dfd921" }

[features]
default = []
all = ["camel_case", "vss"]
camel_case = ["rgb-lib/camel_case"]
vss = ["rgb-lib/vss", "tokio"]
