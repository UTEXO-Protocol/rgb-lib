[package]
name = "rgb-lib-c-ffi"
version = "0.1.0"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.94.0"
build = "build.rs"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "rgblibcffi"

[dependencies]
rgb-lib = { version = "0.3.0-beta.7", path = "../../", features = [
    "electrum",
    "esplora",
] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
] }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[build-dependencies]
cbindgen = "0.29"

[workspace]

# Mirrors the root Cargo.toml patch - this crate is its own workspace, so it
# does not inherit it. Keep the two in step.
[patch.crates-io]
rgb-consensus = { git = "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa", rev = "66819e80df9adb3b5ad100467f3a7179e38ca5a4" }
rgb-ops = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "3bcc7d98d759a8b71bf94ad4a36371dcb7bf392b" }
rgb-invoicing = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "3bcc7d98d759a8b71bf94ad4a36371dcb7bf392b" }
rgb-schemas = { git = "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa", rev = "09d5d494706e75593f71c3f5f06cd89a8dcb807e" }

[features]
default = []
all = ["camel_case", "vss"]
camel_case = ["rgb-lib/camel_case"]
vss = ["rgb-lib/vss", "tokio"]
